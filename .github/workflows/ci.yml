name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: python -m pytest
      - name: gate rules are not writable by the harness (immutability canary)
        run: |
          python - <<'PY'
          import hashlib, pathlib
          h = hashlib.sha256(pathlib.Path("gates/gate_rules.yaml").read_bytes()).hexdigest()
          recorded = pathlib.Path("gates/RULES_SHA256").read_text().strip()
          assert h == recorded, f"gate_rules.yaml changed without updating RULES_SHA256: {h}"
          print("gate rules hash OK:", h[:16])
          PY
