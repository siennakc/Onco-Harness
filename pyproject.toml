[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoharness"
version = "0.2.0"
description = "OncoHarness: a gated, self-improving LLM harness that orchestrates vision models for cancer detection - deterministic state machine, evidence ledger, eval gates the agent cannot write."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sienna Chen", email = "siennakchen@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
